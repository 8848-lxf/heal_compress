deploy_mode: single_engine_maxK
fixed_K: 29696
batch_size: 1

keep_ratios: [1.0, 0.875, 0.75, 0.625, 0.5, 0.375, 0.25]
channel_align: 16
min_keep_ratio: 0.25
include_precision_boundaries: true

precision_profiles:
  - TRT_FP32
  - TRT_FP16
  - TRT_INT8_QDQ

benchmark:
  warmup: 50
  repeat: 200
  timing_method: cuda_event
  int8_qdq_fallback: false
  default_boundary_penalty_ms: 0.02

# H/W/C_base are conservative latency-LUT seed values for lidar_pyramid.
# Update these values from a formal tracer shape report before production LUT
# generation if the deployed model configuration differs.
deployment_units:
  - unit_id: pfn
    module_name: pfn
    block_name: pfn
    block_type: pfn_block
    fixed_K: 29696
    point_feature_dim: 10
    C_in_base: 10
    C_out_base: 64
    C_base: 64

  - unit_id: scatter
    module_name: scatter
    block_name: scatter
    block_type: plugin
    plugin_name: PointPillarScatterTRT
    plugin_version: "current"
    fixed_K: 29696
    H: 200
    W: 704
    C_base: 64

  - unit_id: backbone.stage1
    module_name: backbone
    block_name: stage1
    block_type: conv_block
    H: 200
    W: 704
    C_base: 64
    kernel_size: 3
    stride: 1

  - unit_id: backbone.stage2
    module_name: backbone
    block_name: stage2
    block_type: residual_block
    H: 100
    W: 352
    C_base: 128
    C_mid_base: 128
    kernel_size: 3
    stride: 1

  - unit_id: shrink
    module_name: shrink
    block_name: compression
    block_type: compression_1x1
    H: 100
    W: 352
    C_base: 256
    kernel_size: 1
    stride: 1

  - unit_id: fusion.scale1
    module_name: pyramid_fusion
    block_name: scale1
    block_type: fusion_block
    H: 100
    W: 352
    C_base: 128

  - unit_id: head.cls
    module_name: detection_head
    block_name: cls
    block_type: head_branch
    branch: cls
    H: 100
    W: 352
    C_base: 128
    C_out_base: 2
    kernel_size: 1
    stride: 1
