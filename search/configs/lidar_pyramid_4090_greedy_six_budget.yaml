model:
  checkpoint: /home/lixingfeng/UniAD_examine/Auto_Search/original_models/dairv2s/LiDAROnly/lidar_pyramid/net_epoch_bestval_at17.pth
  config: /home/lixingfeng/UniAD_examine/Auto_Search/original_models/dairv2s/LiDAROnly/lidar_pyramid/config.yaml

runtime:
  gpu_id: "5"
  exclude_gpu_ids: []
  allow_foreign_gpu_processes: true
  max_gpu_utilization_pct: 100
  model_env: univ2x-opt
  tensorrt_env: modelopt
  tensorrt_root: /home/lixingfeng/UniAD_examine/HEAL/prune_model/TensorRT-10.9_x86_cu118
  plugin_path: quantization/plugins/pointpillar_scatter_trt/build/libpointpillar_scatter_trt.so
  plugin_boundary_dtype: fp32

output:
  experiment_name: 4090_legal_width_greedy_six_budget

structure_gene:
  type: legal_keep_width
  decoder: fixed_prune_only_taylor
  ranking_mode: prune_only_second_order_fisher
  ranking_depends_on_precision: false

pruning:
  gene_type: legal_keep_width
  stage1_importance: prune_only_second_order_fisher
  minimum_retained_ratio: 0.10
  minimum_retained_channels: 4
  domain_cap: 0.80
  dense:
    alignment: 4
  grouped_conv:
    preserve_group_count: true
    allow_remove_groups: false
    position_mode: independent_group_topk
    default_channels_per_group: 4
    allowed_channels_per_group: [4, 8, 16, 32, 64, 128, 256, 512]
    require_group_keep_map: true

precision_gene:
  actions_from_deployment_capability: true

precision:
  gene_type: coupled_precision_group
  candidates: [FP32, FP16, INT8]
  default: FP16
  preserve_existing_precision_groups: true
  illegal_int8_policy: strict

candidate_proxy:
  mode: joint_pruning_quantization_second_order_fisher

proxy:
  proxy_mode: joint_taylor_second_order_fisher_diag
  task_score_mapping: raw_joint_loss
  include_activation_taylor: false
  sqnr_main_objective_weight: 0.0
  backend: cuda_batched
  device: auto
  batch_size: 128
  fisher_calibration_batches: 32
  fisher_micro_batch_size: 1
  quant_calibration_batches: 200
  quant_calibration_npz_manifest: /home/lixingfeng/UniAD_examine/heal_compress/tests/quant_deploy/outputs/lidar_pyramid_agent_export_strategy_compare/artifacts/calibration/train_calib_single_engine_maxK29696_200/manifest.json
  quant_activation_calibration_backend: tensorrt_entropy_calibration2
  quant_calibration_force_rebuild: true
  bops_reference: original_strict_fp32
  bops_definition: weight_bits_times_activation_bits

repair:
  role: exception_only
  normal_candidate_repair_enabled: false
  may_add_pruning: false
  may_change_precision: false

conditional_channel_refinement:
  enabled: false

search:
  max_pruning_units: 100000

greedy:
  enabled: true
  targets: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30]
  primary_tolerance: 0.005
  expanded_tolerance: 0.0075
  frontier_size: 1
  max_expansions: 4096
  deploy_final_only: true

cache:
  fresh_run: true
  reuse_external_cache: false
  resume: false
