model:
  checkpoint: /home/lixingfeng/UniAD_examine/Auto_Search/original_models/dairv2s/LiDAROnly/lidar_pyramid/net_epoch_bestval_at17.pth
  config: /home/lixingfeng/UniAD_examine/Auto_Search/original_models/dairv2s/LiDAROnly/lidar_pyramid/config.yaml

runtime:
  gpu_id: "4"
  exclude_gpu_ids: []
  allow_foreign_gpu_processes: false
  max_gpu_utilization_pct: 20
  model_env: univ2x-opt
  tensorrt_env: modelopt
  tensorrt_root: /home/lixingfeng/UniAD_examine/HEAL/prune_model/TensorRT-10.9_x86_cu118
  plugin_path: quantization/plugins/pointpillar_scatter_trt/build/libpointpillar_scatter_trt.so
  plugin_boundary_dtype: fp32

output:
  experiment_name: 4090_bops_021_anchor_study

pruning:
  gene_type: coupled_channel_keep_mask
  stage1_importance: second_order_fisher
  repair_importance: first_order_taylor
  local_domain_ranking: true
  minimum_retained_ratio: 0.10
  dense:
    alignment: 4
    repair_mode: monotonic_floor
  grouped_conv:
    preserve_group_count: true
    allow_remove_groups: false
    position_mode: independent_group_topk
    repair_mode: mask_preserving_equal_count_floor
    default_channels_per_group: 8
    allowed_channels_per_group: [4, 8, 16, 32, 64, 128, 256, 512]
    require_group_keep_map: true

precision:
  gene_type: coupled_precision_group
  candidates: [FP32, FP16, INT8]
  default: FP16
  preserve_existing_precision_groups: true
  forbid_synthetic_per_module_groups: true
  illegal_int8_policy: strict

proxy:
  backend: cuda_batched
  device: auto
  batch_size: 128
  fisher_calibration_batches: 8
  quant_calibration_batches: 200
  quant_calibration_npz_manifest: /home/lixingfeng/UniAD_examine/heal_compress/tests/quant_deploy/outputs/lidar_pyramid_agent_export_strategy_compare/artifacts/calibration/train_calib_single_engine_maxK29696_200/manifest.json
  quant_activation_calibration_backend: tensorrt_entropy_calibration2
  quant_calibration_force_rebuild: true
  alpha_fisher: 0.55
  beta_sqnr: 0.25
  gamma_size: 0.05
  delta_bops_penalty: 0.15
  bops_definition: weight_bits_times_activation_bits

search:
  # This value bounds the existing dense-domain inventory; no GA is invoked.
  max_pruning_units: 96

anchor_study:
  smoke_frames: 10
  planning_materialization_limit: 12
  # Study-only late local domains from the existing formal trace. This does
  # not change the Stage A search space or tracer.
  pruning_root_patterns:
    - pyramid_backbone.deblocks.0.0
    - pyramid_backbone.deblocks.1.0
    - pyramid_backbone.deblocks.2.0
    - shrink_conv.layers.0.double_conv.0
    - shrink_conv.layers.0.double_conv.2
  selection_seed: 42
  ga_enabled: false

stage2:
  num_frames: 200
  warmup_frames: 20
  reset_after_warmup: true
  latency_rounds: 1
  latency_metric: forward_p50_ms
  target_bops_retention: 0.21
  bops_tolerance: 0.005
  max_map_drop: null
