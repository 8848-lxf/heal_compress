model:
  checkpoint: ${MODEL_ROOT}/lidar_pyramid/net_epoch_bestval_at17.pth
  config: ${MODEL_ROOT}/lidar_pyramid/config.yaml

runtime:
  gpu_id: auto
  exclude_gpu_ids: [5, 6, 7]
  model_env: univ2x-opt
  tensorrt_env: modelopt
  tensorrt_root: ${TENSORRT_ROOT}

search:
  seed: 42
  outer_rounds: 1
  population_size: 8
  generations_per_round: 5
  elite_ratio: 0.10
  crossover_rate: 0.80
  prune_mutation_rate: 0.03
  precision_group_mutation_rate: 0.10
  precision_mutation_rate: 0.10
  immigrant_ratio: 0.10
  stagnation_generations: 3
  stagnation_immigrant_ratio: 0.25
  topk_real: 2
  exploitation_count: 1
  diversity_count: 0
  exploration_count: 1

pruning:
  search_variable: legal_pruning_action
  include_regular_grouped_conv: true
  grouped_conv_mode: shared_local_mean
  grouped_conv_align: 8
  require_group_keep_map: true
  maximum_parameter_pruning_ratio: 0.10

precision:
  search_variable: coupled_precision_group
  candidates: [FP32, FP16, INT8]
  default: FP16
  preserve_existing_precision_groups: true
  forbid_per_module_synthetic_groups: true
  smoke_minimum_int8_macs_ratio: 0.10

proxy:
  fisher_calibration_batches: 8
  quant_calibration_batches: 16
  size_reference: fp16_deploy
  bops_reference: fp16_deploy
  bops_constraint_mode: feasibility_first
  bops_target_schedule:
    start: 0.95
    end: 0.80
  lambda_bops: 20.0
  require_runtime_shape_profile: true
  fail_on_missing_runtime_shape: true
  alpha_fisher: 1.0
  beta_sqnr: 1.0
  gamma_size: 1.0
  delta_bops: 1.0

stage2:
  num_frames: 5
  warmup_frames: 10
  latency_rounds: 1
  latency_metric: forward_p50_ms
  eta_map: 1.0
  eta_latency: 1.0

cache:
  fresh_run: true
  reuse_external_cache: false
  resume: false

output:
  root: tests/outputs
  experiment_name: lidar_pyramid_joint_search_coupled_groups
  overwrite: false
