search:
  seed: 42
  outer_rounds: 10
  population_size: 100
  generations_per_round: 30
  elite_ratio: 0.10
  crossover_rate: 0.80
  prune_mutation_rate: 0.03
  precision_mutation_rate: 0.08
  immigrant_ratio: 0.08
  stagnation_generations: 8
  stagnation_immigrant_ratio: 0.25
  topk_real: 5
  exploitation_count: 3
  diversity_count: 1
  exploration_count: 1

precision:
  candidates:
    - FP32
    - FP16
    - INT8
  default: FP16
  protect_unsupported_layers: true
  use_realized_profile_for_hash: true

proxy_objective:
  alpha_fisher: 1.0
  beta_sqnr: 1.0
  gamma_size: 1.0
  delta_bops: 1.0
  size_threshold: null
  bops_threshold: 0.40
  illegal_score: .inf

stage2_objective:
  eta_map: 1.0
  eta_latency: 1.0
  latency_metric: forward_mean_ms
  max_map_drop: null
  failure_score: .inf

evaluation:
  num_frames: 500
  manifest_path: null
  warmup_frames: 50
  rounds: 3

cache:
  root: tests/outputs/joint_search_cache
  reuse_proxy: true
  reuse_physical_model: true
  reuse_onnx: true
  reuse_qdq_onnx: true
  reuse_engine: true
  reuse_real_eval: true

runtime:
  gpu_id: auto
  exclude_gpu_ids:
    - 5
    - 6
    - 7
  fail_fast: false
  resume: true

search_space:
  pruning_unit_ids: []
  precision_layer_ids: []
  protected_pruning_unit_ids: []
