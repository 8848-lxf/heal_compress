model:
  checkpoint: ${MODEL_ROOT}/lidar_pyramid/net_epoch_bestval_at17.pth
  config: ${MODEL_ROOT}/lidar_pyramid/config.yaml

runtime:
  gpu_id: 6
  exclude_gpu_ids: []
  model_env: univ2x-opt
  tensorrt_env: modelopt
  tensorrt_root: ${TENSORRT_ROOT}

output:
  experiment_name: h800_explicit_qdq_production_acceptance

baselines:
  build_before_search: true
  precisions:
    - trusted_explicit_qdq_int8

pruning:
  gene_type: coupled_channel_keep_mask
  grouped_conv_mode: shared_local_mean
  grouped_conv:
    allowed_channels_per_group: [4, 8, 16, 32, 64, 128, 256, 512]

precision:
  gene_type: coupled_precision_group
  candidates: [FP32, FP16, INT8]
  default: FP16

proxy:
  fisher_calibration_batches: 0
  quant_calibration_batches: 200
  quant_activation_calibration_backend: modelopt_histogram_entropy
  quant_calibration_force_rebuild: true

search:
  max_pruning_units: 96

stage2:
  num_frames: 10
  warmup_frames: 10
  reset_after_warmup: true
  latency_rounds: 1
  latency_metric: forward_p50_ms
