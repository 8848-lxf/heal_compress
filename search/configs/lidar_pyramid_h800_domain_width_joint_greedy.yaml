model:
  checkpoint: /home/lixingfeng/UniAD_examine/Auto_Search/original_models/dairv2s/LiDAROnly/lidar_pyramid/net_epoch_bestval_at17.pth
  config: /home/lixingfeng/UniAD_examine/Auto_Search/original_models/dairv2s/LiDAROnly/lidar_pyramid/config.yaml

runtime:
  gpu_id: 6
  exclude_gpu_ids: []
  model_env: univ2x-opt
  tensorrt_env: modelopt
  tensorrt_root: /home/lixingfeng/UniAD_examine/TensorRT-10.9_x86_cu118
  plugin_path: quantization/plugins/pointpillar_scatter_trt/build/libpointpillar_scatter_trt.so

output:
  experiment_name: h800_domain_width_joint_greedy

baselines:
  build_before_search: false

pruning:
  gene_type: legal_domain_width
  fixed_ranking: pruning_only_first_plus_second_order_fisher_taylor
  minimum_retained_ratio: 0.10
  dense:
    alignment: 4
  grouped_conv:
    preserve_group_count: true
    allow_remove_groups: false
    allowed_channels_per_group: [4, 8, 16, 32, 64, 128, 256, 512]
    require_group_keep_map: true

precision:
  gene_type: coupled_precision_group_with_merge_contract
  candidates: [FP32, FP16, INT8]
  default: FP32
  weight_granularity: production_layout_aware_per_channel
  activation_calibration: tensorrt_entropy_calibration2
  merge_policy: explicit_fp16_merge_then_optional_requantize

proxy:
  objective_mode: joint_weight_taylor_hard_bops
  backend: cuda_batched
  device: auto
  batch_size: 128
  fisher_calibration_batches: 8
  quant_calibration_batches: 200
  quant_calibration_npz_manifest: /home/lixingfeng/UniAD_examine/heal_compress/tests/quant_deploy/outputs/lidar_pyramid_agent_export_strategy_compare/artifacts/calibration/train_calib_single_engine_maxK29696_200/manifest.json
  quant_activation_calibration_backend: tensorrt_entropy_calibration2
  quant_calibration_force_rebuild: false
  activation_taylor_included: false
  parameter_retention_tiebreak_epsilon: 0.0
  parameter_retention_role: report_only
  size_reference: original_strict_fp32
  bops_reference: original_strict_fp32
  bops_definition: weight_bits_times_activation_bits
  bops_constraint_mode: hard_feasibility
  bops_targets: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30]

search:
  method: greedy
  seed: 42
  bops_targets: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30]
  maximum_steps: 10000
  minimum_bops_reduction: 1.0e-12
  parameter_retention_tiebreak: true

stage2:
  # The greedy orchestration bypasses this 500-frame tier: only each unique
  # final budget candidate is materialized/deployed and fully evaluated.
  num_frames: 500
  warmup_frames: 200
  reset_after_warmup: true
  latency_rounds: 3
  latency_metric: forward_p50_ms
  accuracy_reference: original_strict_fp32
  latency_reference: original_strict_fp16
  tau_ap: 0.02
  eta_ap: 0.80
  eta_latency: 0.20

full_validation:
  num_frames: 1789
  warmup_frames: 200
  reset_after_warmup: true
  latency_rounds: 3

cache:
  layered_hashes: true
  reuse_across_budgets: true
  reuse_across_resume: true
  reject_unproven_cache: true
