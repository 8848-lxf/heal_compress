model:
  checkpoint: /home/lixingfeng/UniAD_examine/Auto_Search/original_models/dairv2s/LiDAROnly/lidar_pyramid/net_epoch_bestval_at17.pth
  config: /home/lixingfeng/UniAD_examine/Auto_Search/original_models/dairv2s/LiDAROnly/lidar_pyramid/config.yaml

runtime:
  gpu_id: auto
  exclude_gpu_ids: [5, 6, 7]
  model_env: univ2x-opt
  tensorrt_env: modelopt
  tensorrt_root: /home/lixingfeng/UniAD_examine/HEAL/prune_model/TensorRT-10.9_x86_cu118

baselines:
  build_before_search: true
  precisions: [strict_fp32, strict_fp16, maximal_legal_int8]
  disable_tf32_for_fp32: true
  use_explicit_qdq_for_int8: true
  fail_on_silent_precision_fallback: true
  full_validation: true
  require_common_frame_subset: true

pruning:
  importance: second_order_fisher
  local_domain_ranking: true
  dense_channel_alignment: 4
  minimum_retained_ratio: 0.10
  grouped_conv:
    preserve_group_count: true
    allow_remove_groups: false
    position_mode: independent_group_topk
    supported_position_modes: [shared_local_mean, independent_group_topk]
    default_channels_per_group: 8
    allowed_channels_per_group: [4, 8, 16, 32, 64, 128, 256, 512]
    require_group_keep_map: true

precision:
  search_variable: coupled_precision_group
  candidates: [FP32, FP16, INT8]
  default: FP16
  preserve_existing_precision_groups: true
  forbid_synthetic_per_module_groups: true

proxy:
  device: auto
  batch_size: 128
  fisher_calibration_batches: 8
  quant_calibration_batches: 200
  size_reference: strict_fp16
  bops_reference: strict_fp16
  alpha_prune: 1.0
  beta_sqnr: 1.0
  gamma_size: 1.0
  delta_bops: 1.0
  bops_constraint_mode: feasibility_first
  bops_target_schedule:
    start: 0.95
    end: 0.75
  lambda_bops: 20.0
  maximum_parameter_pruning_ratio: 0.10
  smoke_minimum_realized_int8_macs_ratio: 0.10

search:
  seed: 42
  outer_rounds: 1
  initial_population_size: 1024
  population_size: 512
  offspring_size: 512
  generations_per_round: 5
  elite_ratio: 0.05
  crossover_rate: 0.80
  prune_mutation_rate: 0.03
  precision_group_mutation_rate: 0.08
  immigrant_ratio: 0.08
  stagnation_generations: 3
  stagnation_immigrant_ratio: 0.25
  topk_real: 2
  exploitation_count: 1
  exploration_count: 1

stage2_smoke:
  num_frames: 5
  warmup_frames: 10
  latency_rounds: 1
  latency_metric: forward_p50_ms

full_validation:
  use_complete_val_manifest: true
  prefer_zero_skip_profile: true
  warmup_frames: 50
  latency_rounds: 3
  latency_metric: forward_p50_ms
  accuracy_reference: strict_fp32
  latency_reference: strict_fp16

cache:
  fresh_run: true
  reuse_external_cache: false
  resume: false

output:
  root: tests/outputs
  experiment_name: lidar_pyramid_joint_search_large_population
  overwrite: false
