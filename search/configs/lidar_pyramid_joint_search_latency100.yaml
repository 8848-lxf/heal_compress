model:
  checkpoint: ${MODEL_ROOT}/lidar_pyramid/net_epoch_bestval_at17.pth
  config: ${MODEL_ROOT}/lidar_pyramid/config.yaml

runtime:
  gpu_id: auto
  exclude_gpu_ids: [5, 6, 7]
  model_env: univ2x-opt
  tensorrt_env: modelopt
  tensorrt_root: ${TENSORRT_ROOT}

search:
  seed: 42
  outer_rounds: 1
  population_size: 8
  generations_per_round: 5
  topk_real: 2
  exploitation_count: 1
  diversity_count: 0
  exploration_count: 1

precision:
  search_variable: coupled_precision_group
  candidates: [FP32, FP16, INT8]
  default: FP16
  preserve_existing_precision_groups: true
  forbid_per_module_synthetic_groups: true

stage2:
  num_frames: 100
  warmup_frames: 30
  latency_rounds: 3
  latency_metric: forward_p50_ms
  eta_map: 1.0
  eta_latency: 1.0

cache:
  fresh_run: false
  reuse_external_cache: true
  resume: true

output:
  root: tests/outputs
  experiment_name: lidar_pyramid_joint_search_latency100
  overwrite: false
