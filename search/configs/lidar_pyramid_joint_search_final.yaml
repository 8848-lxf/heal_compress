model:
  checkpoint: /home/lixingfeng/UniAD_examine/Auto_Search/original_models/dairv2s/LiDAROnly/lidar_pyramid/net_epoch_bestval_at17.pth
  config: /home/lixingfeng/UniAD_examine/Auto_Search/original_models/dairv2s/LiDAROnly/lidar_pyramid/config.yaml

runtime:
  gpu_id: auto
  exclude_gpu_ids: [5, 6, 7]
  model_env: univ2x-opt
  tensorrt_env: modelopt
  tensorrt_root: /home/lixingfeng/UniAD_examine/TensorRT-10.9_x86_cu118

baselines:
  build_before_search: true
  precisions:
    - strict_fp32
    - strict_fp16
    - maximal_legal_int8
  full_validation: true
  explicit_qdq_int8: true

pruning:
  gene_type: coupled_channel_keep_mask
  keep_value: 1
  prune_value: 0
  stage1_importance: second_order_fisher
  repair_importance: first_order_taylor
  local_domain_ranking: true
  minimum_retained_ratio: 0.10

  dense:
    alignment: 4
    repair_mode: monotonic_floor

  grouped_conv:
    preserve_group_count: true
    allow_remove_groups: false
    use_default_topk_selector: false
    repair_mode: mask_preserving_equal_count_floor
    allowed_channels_per_group:
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
    require_group_keep_map: true

precision:
  gene_type: coupled_precision_group
  candidates: [FP32, FP16, INT8]
  preserve_existing_precision_groups: true
  forbid_synthetic_per_module_groups: true
  illegal_int8_policy: strict
  default: FP16

proxy:
  backend: cuda_batched
  device: auto
  batch_size: 128
  fisher_calibration_batches: 8
  quant_calibration_batches: 200
  term_normalization: none

  size_reference: original_strict_fp32
  bops_reference: original_strict_fp32
  bops_definition: weight_bits_times_activation_bits

  alpha_fisher: 0.55
  beta_sqnr: 0.25
  gamma_size: 0.05
  delta_bops_penalty: 0.15

  bops_constraint_mode: weighted_penalty
  bops_soft_constraint:
    enabled: true
    start_target: 0.25
    end_target: 0.18
    formula: squared_relative_excess

search:
  seed: 42
  outer_rounds: 4
  initial_population_size: 1024
  population_size: 512
  offspring_size: 512
  generations_per_round: 5

  elite_ratio: 0.05
  crossover_rate: 0.80
  prune_mutation_rate: 0.03
  precision_group_mutation_rate: 0.08
  immigrant_ratio: 0.08
  stagnation_generations: 3
  stagnation_immigrant_ratio: 0.25

  repair_pool_size: 50
  topk_stage2: 5
  global_cross_round_dedup: true

stage2:
  num_frames: 300
  warmup_frames: 30
  latency_rounds: 3
  latency_metric: forward_p50_ms

  accuracy_reference: original_strict_fp32
  latency_reference: original_strict_fp16

  tau_ap: 0.02
  eta_ap: 0.80
  eta_latency: 0.20

final_selection:
  reevaluate_round_winners_on_full_validation: true
  objective: same_stage2_F2

cache:
  layered_hashes: true
  reuse_across_rounds: true
  reuse_across_resume: true

output:
  root: tests/outputs
  experiment_name: lidar_pyramid_joint_search_final
  overwrite: false
