pruning:
  model: lidar_pyramid
  importance: l1
  target_prune_ratio: 0.2
  min_keep_ratio: 0.5
  align: 16
  group_conv_align: 8
  group_conv_selection_mode: shared_local_mean
  group_conv_prune_mode: keep_groups
  protect_residual_add: true
  allow_remove_groups: false
inputs:
  trace_report: tests/quant_deploy/outputs/lidar_pyramid_agent_export_strategy_compare/tracer_reports/lidar_pyramid/coupled_channel_groups.json
outputs:
  plan_dir: tests/quant_deploy/outputs/lidar_pyramid_agent_export_strategy_compare/pruning_reports/lidar_pyramid_plan_only
  export_dir: tests/quant_deploy/outputs/lidar_pyramid_agent_export_strategy_compare/pruned_models/lidar_pyramid
  eval_dir: tests/quant_deploy/outputs/lidar_pyramid_agent_export_strategy_compare/pruning_eval/lidar_pyramid
